# yaml-language-server: $schema=https://cubic.dev/schema/cubic-repository-config.schema.json

version: 1

reviews:
  custom_rules:
    - name: Validate uv lockfile consistency
      description: |
        CRITICAL: Check Python dependency consistency.

        For every pull request involving Python dependencies:

        1. Inspect pyproject.toml and uv.lock.
        2. Check whether dependency declarations are
           consistent with the lockfile.
        3. Check changes to dependencies, optional dependencies,
           dependency groups and requires-python.
        4. If a dependency change makes uv.lock outdated,
           report it as a review issue.
        5. Recommend running `uv lock --check`.
        6. Do not assume the lockfile is valid merely
           because the uv.lock file exists.
        7. Do not require a lockfile change when the
           existing lockfile is still consistent.

        Treat a confirmed outdated lockfile as a bug
        affecting reproducible builds.
