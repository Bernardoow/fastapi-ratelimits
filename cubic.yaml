# yaml-language-server: $schema=https://cubic.dev/schema/cubic-repository-config.schema.json

version: 1

reviews:
  custom_rules:
    - name: Python lockfile consistency
      description: |
        Verify that uv.lock remains consistent with pyproject.toml when
        dependencies, Python version constraints (`project.requires-python`),
        or the project version (`project.version`) change.

        Report inconsistencies and recommend running
        `uv lock --check`.

        Do not require uv.lock to change when the
        existing lockfile is already valid.
