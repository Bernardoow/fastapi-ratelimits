name: Publish to PyPI

on:
  release:
    types: [published]

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379/tcp
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Check out the release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.17"
          python-version: "3.11"
          enable-cache: false
      - name: Check the release tag against the package version
        run: |
          version=$(uv version --short)
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Expected tag v$version for this package version, got $GITHUB_REF_NAME."
            exit 1
          fi
      - name: Install test dependencies
        run: uv sync --locked --extra redis
      - name: Run tests with Redis
        env:
          RATELIMITS_TEST_REDIS_URL: redis://127.0.0.1:${{ job.services.redis.ports[6379] }}/0
        run: uv run --no-sync pytest
      - name: Check types and lint
        run: |
          uv run --no-sync mypy
          uv run --no-sync ruff check .
      - name: Build the wheel and source distribution
        run: uv build --no-sources
      - name: Install and import the wheel in a clean environment
        run: |
          wheel_python="$RUNNER_TEMP/wheel-test/bin/python"
          uv venv --python 3.11 "$RUNNER_TEMP/wheel-test"
          uv pip install --python "$wheel_python" dist/*.whl
          "$wheel_python" -I -c 'from fastapi_ratelimits import Limiter'
      - name: Upload distribution artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
