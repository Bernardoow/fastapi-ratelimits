[project]
name = "fastapi-ratelimits"
version = "0.1.0"
description = "Async rate limiting for FastAPI dependencies, powered by limits"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Bernardo Gomes" }
]
requires-python = ">=3.11"
dependencies = ["fastapi>=0.163.1,<1", "limits>=5.8,<6"]

[project.urls]
Repository = "https://github.com/Bernardoow/fastapi-ratelimits"
Issues = "https://github.com/Bernardoow/fastapi-ratelimits/issues"

[project.optional-dependencies]
redis = ["redis>=5.2,<8"]

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1,<3",
    "httpx>=0.27,<1",
    "mypy>=1.15,<2",
    "pytest>=8,<10",
    "pytest-asyncio>=0.24,<2",
    "ruff>=0.11,<1",
]
docs = [
    "mkdocstrings[python]>=1.0.6,<2",
    "zensical>=0.1.1,<0.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["redis: integration tests requiring a disposable Redis server"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
