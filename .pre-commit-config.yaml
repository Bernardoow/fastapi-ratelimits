default_install_hook_types: [pre-commit, pre-merge-commit]
repos:
  - repo: local
    hooks:
      - id: uv-lock-check
        name: Check uv lockfile
        entry: >-
          sh -c 'git ls-files --error-unmatch -- pyproject.toml uv.lock >/dev/null &&
          uv lock --check --directory . --project . ||
          { echo "Run uv lock and stage pyproject.toml and uv.lock before committing." >&2;
          exit 1; }'
        language: unsupported
        always_run: true
        pass_filenames: false
        stages: [pre-commit, pre-merge-commit]
